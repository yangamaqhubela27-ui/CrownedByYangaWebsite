<!DOCTYPE html>
<html>
<head>
    <meta name="description" content="Book your hairstyle appointment online with Crowned by Yanga.">
    <title>Booking - Crowned by Yanga</title>
    <link rel="stylesheet" href="css/style.css">
    
</head>
<body>
    <header>
      
    <h1>Crowned by Yanga</h1>

    <!-- Navigation Menu -->
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="gallery.html">Gallery</a>
        <a href="booking.html">Booking</a>
        <a href="contact.html">Contact</a>
    </nav>
</header> 

    <main>

<section class="booking-section">
    <h2>Book Your Appointment</h2>
    <p>Complete the form below to enquire about a hairstyle booking.</p>

    <form id="bookingForm" class="form-card">
        <label for="bookingName">Full Name:</label>
        <input type="text" id="bookingName" name="bookingName" required>

        <label for="bookingEmail">Email Address:</label>
        <input type="email" id="bookingEmail" name="bookingEmail" required>

        <label for="bookingService">Choose a Service:</label>
        <select id="bookingService" name="bookingService" required>
            <option value="">Select a service</option>
            <option value="Braiding">Braiding</option>
            <option value="Wig Install">Wig Install</option>
            <option value="Hair Treatment">Hair Treatment</option>
            <option value="Knotless Braids">Knotless Braids</option>
            <option value="Wash and Blowdry">Wash and Blowdry</option>
        </select>

        <label for="bookingDate">Preferred Date:</label>
        <input type="date" id="bookingDate" name="bookingDate" required>

        <label for="bookingMessage">Extra Message:</label>
        <textarea id="bookingMessage" name="bookingMessage" rows="4" placeholder="Tell us what style you want..."></textarea>

        <button type="submit" class="btn">Submit Booking Enquiry</button>

        <p id="bookingResponse" class="form-response"></p>
    </form>
</section>

</main>

<script src="js/script.js"></script>

   
    






</body>
</html>
