<!DOCTYPE html>
<html>
<head>
    <meta name="description" content="Contact Crowned by Yanga for hairstyle bookings, enquiries and customer support.">
    <title>Contact - Crowned by Yanga</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <h1>Crowned by Yanga</h1>

    <!-- Navigation Menu -->
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="gallery.html">Gallery</a>
        <a href="booking.html">Booking</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>
    <section class="contact-section">
        <h2>Contact Us</h2>
        <p>Send us a message and we will get back to you.</p>

        <form id="contactForm" class="form-card">
            <label for="contactName">Full Name:</label>
            <input type="text" id="contactName" name="contactName" required>

            <label for="contactEmail">Email Address:</label>
            <input type="email" id="contactEmail" name="contactEmail" required>

            <label for="messageType">Message Type:</label>
            <select id="messageType" name="messageType" required>
                <option value="">Select message type</option>
                <option value="General Enquiry">General Enquiry</option>
                <option value="Booking Question">Booking Question</option>
                <option value="Complaint">Complaint</option>
                <option value="Feedback">Feedback</option>
            </select>

            <label for="contactMessage">Message:</label>
            <textarea id="contactMessage" name="contactMessage" rows="5" required></textarea>

            <button type="submit" class="btn">Send Message</button>

            <p id="contactResponse" class="form-response"></p>
        </form>
    </section>
</main>

<script src="js/script.js"></script>

<footer>
    <p>© 2026 Crowned by Yanga | Designed by Yanga Maqhubela</p>
</footer>

</body>
</html>
